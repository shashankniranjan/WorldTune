[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldpulse"
version = "0.1.0"
description = "WorldPulse: event-driven market impact prediction prototype"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "streamlit>=1.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Reads config/impact_channels.yaml (the event -> asset mapping table).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
